# Blue-green deployment. The pipeline replaces __COLOR__ (the idle slot to deploy to),
# __TAG__ (release version) and __ACTIVE__ (slot that currently receives user traffic).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-portal-__COLOR__
  annotations:
    kubernetes.io/change-cause: "Release __TAG__ on __COLOR__"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: food-portal
      slot: __COLOR__
  template:
    metadata:
      labels:
        app: food-portal
        slot: __COLOR__
    spec:
      containers:
      - name: food-portal
        image: ayushsksksk/food-portal:__TAG__
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 2
---
# Production service: users always reach the ACTIVE slot (switched only after validation)
apiVersion: v1
kind: Service
metadata:
  name: food-portal-service
spec:
  type: NodePort
  selector:
    app: food-portal
    slot: __ACTIVE__
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30032
---
# Preview service: points at the NEW slot so the release can be validated before users see it
apiVersion: v1
kind: Service
metadata:
  name: food-portal-preview
spec:
  type: NodePort
  selector:
    app: food-portal
    slot: __COLOR__
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30033
